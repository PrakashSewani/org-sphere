name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

permissions:
  contents: read

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      SemVer: ${{ steps.version.outputs.SemVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="0.1.0"
          fi
          
          commitCount=$(git rev-list --count HEAD)
          shortHash=$(git rev-parse --short HEAD)
          branch="${{ github.ref_name }}"
          
          if [ "$branch" = "main" ]; then
            SemVer="$version"
          elif [ "$branch" = "develop" ]; then
            SemVer="$version-develop.$commitCount+sha.$shortHash"
          else
            SemVer="$version-dev.$commitCount+sha.$shortHash"
          fi
          
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "SemVer=$SemVer" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --no-restore --severity info --verify-no-changes

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, version]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version=${{ needs.version.outputs.SemVer }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ needs.version.outputs.SemVer }}
          path: |
            **/bin/Release/*.dll
            **/bin/Release/*.json
          retention-days: 7

  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [build, version]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          tag="v${{ needs.version.outputs.version }}"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
